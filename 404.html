<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رابط قديم</title>
<meta name="theme-color" content="#F6F2E8">
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#F6F2E8;color:#2B3A34;padding:28px;
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
  .box{max-width:360px;text-align:center;border:1px solid #DCD3BE;border-radius:18px;
    background:#FBF8F1;padding:34px 26px}
  .mark{width:46px;height:46px;margin:0 auto 18px;border-radius:50%;
    border:1.6px solid #A8802F;position:relative}
  .mark::before,.mark::after{content:"";position:absolute;background:#A8802F;
    width:1.6px;height:17px;top:14px;left:21.2px}
  .mark::before{transform:rotate(45deg)}
  .mark::after{transform:rotate(-45deg)}
  h1{font-size:20px;font-weight:700;color:#8A6A2F;margin:0 0 12px}
  p{font-size:15px;line-height:1.95;color:#5A6660;margin:0}
</style>
</head>
<body>
  <div class="box">
    <div class="mark"></div>
    <h1>هذا الرابط لم يعد يعمل</h1>
    <p>انتقلت البطاقة إلى رابط جديد. اطلبه ممّن أرسل لك هذا الرابط.</p>
  </div>
</body>
</html>
