<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>البطاقتان اليوميتان</title>
<meta name="theme-color" content="#10233F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="البطاقتان">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#10233F;--soft:#2C4260;--paper:#F7F1E3;--card:#FFFDF7;--gold:#B9862B;--teal:#1F6F63;--line:rgba(16,35,63,.14)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  header{padding:16px 18px 12px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
  header h1{font-family:"Amiri",serif;font-size:24px;margin:0}
  header .sub{font-size:12.5px;color:var(--soft);opacity:.8}
  .styles{display:flex;gap:8px;overflow-x:auto;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:19}
  .styles button{white-space:nowrap;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
  .styles button[aria-pressed="true"]{background:var(--ink);color:#F3E6C8;border-color:var(--ink)}
  .styles button .d{font-size:11px;opacity:.7;font-weight:500}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 16px 130px;display:grid;grid-template-columns:1fr;gap:20px}
  @media(min-width:960px){.wrap{grid-template-columns:minmax(0,1fr) 420px;align-items:start;padding-bottom:40px}.panel{position:sticky;top:132px}}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);border-radius:12px;font:inherit;font-weight:700;font-size:13.5px;color:var(--soft);cursor:pointer}
  .tab[aria-selected="true"]{background:var(--ink);color:#F3E6C8;border-color:var(--ink)}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
  .sheet{display:none}.sheet.on{display:block}
  .sheet img{width:100%;height:auto;display:block;border-radius:10px;background:#fff}
  .hint{font-size:12px;color:var(--soft);opacity:.75;margin:10px 2px 0;line-height:1.7}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
  fieldset{border:0;padding:0;margin:0 0 16px}
  legend{font-family:"Amiri",serif;font-size:18px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--gold);width:100%}
  label{display:block;font-size:12.5px;font-weight:500;margin:11px 0 5px;color:var(--soft)}
  input[type=text],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
  textarea{min-height:96px;resize:vertical;line-height:1.9;font-family:"Amiri",serif;font-size:17px}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .g2>div{min-width:0}
  .g3>div{min-width:0}
  .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .row{display:flex;gap:8px;align-items:flex-end}.row>div{flex:1}
  .btn{padding:11px 14px;border-radius:11px;border:1px solid var(--ink);background:var(--ink);color:#F3E6C8;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#20160A}
  .btn.sm{padding:9px 12px;font-size:13px}
  .actions{position:fixed;inset:auto 0 0 0;background:rgba(247,241,227,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:30;backdrop-filter:blur(6px)}
  .actions .btn{flex:1}
  @media(min-width:960px){.actions{position:static;background:none;border:0;padding:14px 0 0;backdrop-filter:none}}
  .check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px}
  .check input{width:18px;height:18px;accent-color:var(--gold)}
  .times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tcell label{margin:0 0 4px}
  .hm{display:flex;align-items:center;gap:6px}
  .hm input{width:100%;padding:9px 6px;text-align:center;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
  .hm input::-webkit-outer-spin-button,.hm input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .hm input[type=number]{-moz-appearance:textfield}
  .hm span{font-weight:700;opacity:.5}
  input[type=date]{width:100%;max-width:100%;min-width:0;-webkit-appearance:none;appearance:none;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
  .saved{font-size:12px;color:var(--teal);min-height:16px;margin-top:8px;line-height:1.6}
  button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>البطاقتان اليوميتان</h1>
  <div class="sub">سبعة أنماط، نمط لكل يوم، وتستطيع تغييره متى شئت. <b style="color:var(--gold)">نسخة 3.7</b></div>
</header>

<div class="styles" id="styleBar"></div>

<div class="wrap">
  <main>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab1" aria-selected="true">الحديث</button>
      <button class="tab" role="tab" id="tab2" aria-selected="false">المواقيت</button>
    </div>
    <div class="stage">
      <div class="sheet on" id="sheet1"><img id="img1" alt="معاينة بطاقة الحديث"></div>
      <div class="sheet" id="sheet2"><img id="img2" alt="معاينة بطاقة المواقيت"></div>
      <p class="hint">اضغط مطولًا على الصورة لحفظها أو إرسالها مباشرة من الجوال.</p>
    </div>
  </main>

  <aside class="panel">
    <fieldset>
      <legend>النمط</legend>
      <div class="check">
        <input type="checkbox" id="f_autostyle" checked>
        <label for="f_autostyle" style="margin:0">اختر النمط تلقائيًا حسب يوم الأسبوع</label>
      </div>
      <div id="photoBox" hidden>
        <label for="f_photo">صورة الخلفية (لنمط الإطار المصوَّر)</label>
        <input type="file" id="f_photo" accept="image/*">
      </div>
    </fieldset>

    <fieldset>
      <legend>الصفحة الأولى</legend>
      <div class="row">
        <div>
          <label for="f_lib">مكتبة الأحاديث</label>
          <select id="f_lib"></select>
        </div>
        <button class="btn ghost sm" id="btnNextHadith" type="button">التالي</button>
      </div>
      <div class="check">
        <input type="checkbox" id="f_autocontent" checked>
        <label for="f_autocontent" style="margin:0">حديث اليوم ورسالته تلقائيًا (يتبدلان كل يوم)</label>
      </div>
      <label for="f_head">الترويسة</label>
      <input type="text" id="f_head">
      <label for="f_body">نص الحديث</label>
      <textarea id="f_body"></textarea>
      <label for="f_src">التخريج</label>
      <input type="text" id="f_src">
      <label for="f_notes">فوائد مختصرة (سطر لكل فائدة)</label>
      <textarea id="f_notes" style="min-height:76px"></textarea>
      <label for="f_multi">تلوين الأسطر</label>
      <select id="f_multi"><option value="1">متناوب</option><option value="0">لون واحد</option></select>
    </fieldset>



    <fieldset>
      <legend>العبارات</legend>
      <div class="row">
        <div><label for="f_msgLib">مكتبة الرسائل</label><select id="f_msgLib"></select></div>
        <button class="btn ghost sm" id="btnNextMsg" type="button">التالي</button>
      </div>
      <label for="f_msg">الرسالة السفلية</label>
      <textarea id="f_msg" style="min-height:70px"></textarea>
      <div class="row">
        <div><label for="f_ribbon">عبارة الشريط</label><input type="text" id="f_ribbon"></div>
        <button class="btn ghost sm" id="btnRibbon" type="button">التالي</button>
      </div>
      <div class="check">
        <input type="checkbox" id="f_autoribbon" checked>
        <label for="f_autoribbon" style="margin:0">عبارة مناسبة لليوم تلقائيًا</label>
      </div>
    </fieldset>
    <fieldset>
      <legend>المكان والتاريخ</legend>
      <div class="g2">
        <div><label for="f_city">المدينة</label><select id="f_city"></select></div>
        <div><label for="f_date">التاريخ</label><input type="date" id="f_date"></div>
      </div>
      <div class="g2">
        <div>
          <label for="f_method">طريقة الحساب</label>
          <select id="f_method">
            <option value="homs">تقويم حمص المحلي</option>
            <option value="mwl">رابطة العالم الإسلامي</option>
            <option value="uaq">أم القرى</option>
            <option value="egypt">الهيئة المصرية</option>
            <option value="karachi">كراتشي</option>
            <option value="diyanet">ديانت التركية</option>
          </select>
        </div>
        <div>
          <label for="f_asr">العصر</label>
          <select id="f_asr"><option value="1">الجمهور</option><option value="2">الحنفي</option></select>
        </div>
      </div>
      <div class="g2">
        <div>
          <label for="f_hijriAdj">تعديل الهجري</label>
          <select id="f_hijriAdj">
            <option value="-1">يوم أقل</option>
            <option value="0" selected>بلا تعديل</option>
            <option value="1">يوم أكثر</option>
          </select>
        </div>
        <div>
          <label for="f_ihtiyat">احتياط دقيقة</label>
          <select id="f_ihtiyat"><option value="1">نعم</option><option value="0">لا</option></select>
        </div>
      </div>
      <p class="hint" id="calcNote"></p>
    </fieldset>
    <fieldset>
      <legend>المواقيت</legend>
      <div class="times" id="timesBox"></div>
      <button class="btn ghost sm" id="btnRecalc" type="button" style="margin-top:10px">إعادة الحساب</button>
    </fieldset>

    <div class="check">
      <input type="checkbox" id="f_auto" checked>
      <label for="f_auto" style="margin:0">حفظ تلقائي</label>
    </div>
    <p class="saved" id="saved"></p>

    <div class="actions">
      <button class="btn gold" id="btnDl">تنزيل الصورتين</button>
      <button class="btn" id="btnShare">مشاركة</button>
      <button class="btn ghost" id="btnReset">استعادة</button>
    </div>
  </aside>
</div>

<script>
(function(){
"use strict";
var AR='"Amiri","Scheherazade New","Noto Naskh Arabic",serif', B='700 ';
var W1=1080,H1=1440,W2=1080,H2=1920;

/* ============ الأنماط السبعة ============ */
var STYLES={
  illum:{ name:"تذهيب", day:"السبت", frame:"plait", rows:"ornate",
    paper:"#FAF3E2", ink:"#22303F", band:"#1B3A6B", band2:"#8E1B1B",
    gold:"#C69A34", gold2:"#F0D896", accent:["#1F6F4E","#1B4E8C","#8E1B1B","#B07514"], grain:true },
  modern:{ name:"معاصر", day:"الأحد", frame:"rules", rows:"plain",
    paper:"#F6F3EA", ink:"#173F33", band:"#14503C", band2:"#14503C",
    gold:"#A98A3C", gold2:"#D8C084", accent:["#14503C","#1F6F4E","#0F3D2E","#276B57"] },
  tile:{ name:"قيشاني", day:"الإثنين", frame:"tilestrip", rows:"ornate",
    paper:"#F2F7F7", ink:"#0E3A44", band:"#0F6E7A", band2:"#123E86",
    gold:"#C08A2A", gold2:"#EBC97E", accent:["#0F6E7A","#123E86","#0E3A44","#1C7F6B"] },
  ottoman:{ name:"نبوي", day:"الثلاثاء", frame:"scallop", rows:"ornate",
    paper:"#F5F6EF", ink:"#1D3B2A", band:"#174B34", band2:"#0F3323",
    gold:"#B08A2E", gold2:"#E5CE93", accent:["#174B34","#1D3B2A","#0F3323","#8A6B1E"], grain:true },
  night:{ name:"ليلي", day:"الأربعاء", frame:"hairline", rows:"ornate", dark:true,
    paper:"#0C1C33", ink:"#F1E6C8", band:"#0A1728", band2:"#123157",
    gold:"#D9B45A", gold2:"#F6E3A8", accent:["#F1E6C8","#D9B45A","#EBD9AC","#C9A24A"], grain:true },
  sand:{ name:"رملي", day:"الخميس", frame:"sandrule", rows:"plain",
    paper:"#F6EEDF", ink:"#4A3826", band:"#9C4A2A", band2:"#7A3A20",
    gold:"#A87C3A", gold2:"#D9B67A", accent:["#9C4A2A","#4A3826","#7A3A20","#A87C3A"], grain:true },
  photo:{ name:"مصوَّر", day:"الجمعة", frame:"photo", rows:"ornate", dark:true, photo:true,
    paper:"#101418", ink:"#FFFFFF", band:"#000000", band2:"#000000",
    gold:"#E0BE72", gold2:"#F7E6B4", accent:["#FFFFFF","#F7E6B4","#FFFFFF","#F7E6B4"] }
};
var DAY_STYLE=["modern","illum","tile","ottoman","night","sand","photo"]; /* الأحد ... السبت */

/* ============ العبارات ============ */
var RIBBONS=[
  "صلّوا على خير الأنام",
  "اللهم صلِّ وسلّم على نبينا محمد",
  "خير الكلام ذكر الله",
  "سبحان الله وبحمده",
  "أستغفر الله العظيم وأتوب إليه",
  "لا حول ولا قوة إلا بالله",
  "اللهم اجعل يومنا خيرًا من أمسنا"
];
var DAY_RIBBON={ 1:"تذكير: صيام يوم الاثنين", 4:"تذكير: صيام يوم الخميس", 5:"تذكير: سورة الكهف وكثرة الصلاة على النبي" };

/* ============ مكتبة الأحاديث ============ */
var HADITHS=[
 {t:"الأعمال بالنيات", b:"إِنَّمَا الأَعْمَالُ بِالنِّيَّاتِ،\nوَإِنَّمَا لِكُلِّ امْرِئٍ مَا نَوَى.", s:"متفق عليه",
  n:"العمل الواحد يعظم أو يسقط بحسب نية صاحبه.\nتصحيح النية أشق من العمل نفسه وأعظم أثرًا.\nالنية تحوّل العادة إلى عبادة."},
 {t:"طلب العلم", b:"مَنْ سَلَكَ طَرِيقًا يَلْتَمِسُ فِيهِ عِلْمًا،\nسَهَّلَ اللهُ لَهُ بِهِ طَرِيقًا إِلَى الْجَنَّةِ.", s:"رواه مسلم",
  n:"السعي في طلب العلم سبب لدخول الجنة وتيسير أسبابها.\nالعلماء ورثة الأنبياء، ورّثوا العلم لا الدينار والدرهم.\nكل خطوة في طريق العلم محسوبة عند الله."},
 {t:"أجر الأذى", b:"مَا مِنْ مُسْلِمٍ يُصِيبُهُ أَذًى،\nإِلَّا حَاتَّ اللهُ عَنْهُ خَطَايَاهُ\nكَمَا تَحَاتُّ وَرَقُ الشَّجَرِ.", s:"رواه البخاري",
  n:"المصائب مكفّرات للذنوب لا عقوبات مجردة.\nحتى الهمّ والوصب والنصب داخل في هذا الأجر.\nمن أحسن الظن بالله في بلائه هان عليه."},
 {t:"الاستعجال في الدعاء", b:"يُسْتَجَابُ لِأَحَدِكُمْ مَا لَمْ يَعْجَلْ،\nفَيَقُولُ: قَدْ دَعَوْتُ رَبِّي فَلَمْ يَسْتَجِبْ لِي.", s:"رواه مسلم",
  n:"تأخر الإجابة ابتلاء للصبر لا ردّ للدعاء.\nالعجلة تضع الشيء في غير موضعه وتجلب الندم.\nالدعاء لا يضيع: إجابة، أو صرف بلاء، أو ادّخار."},
 {t:"ترك ما لا يعني", b:"مِنْ حُسْنِ إِسْلَامِ الْمَرْءِ\nتَرْكُهُ مَا لَا يَعْنِيهِ.", s:"رواه الترمذي",
  n:"انشغال المرء بما لا يخصه أول أبواب الغيبة والفضول.\nالوقت والطاقة أثمن من أن ينفقا فيما لا ينفع.\nحسن الإسلام يقاس بما تترك كما يقاس بما تفعل."},
 {t:"الكلمة الطيبة", b:"اتَّقُوا النَّارَ وَلَوْ بِشِقِّ تَمْرَةٍ،\nفَمَنْ لَمْ يَجِدْ فَبِكَلِمَةٍ طَيِّبَةٍ.", s:"متفق عليه",
  n:"لا عذر لأحد في ترك المعروف مهما قلّ ذات يده.\nالكلمة الطيبة صدقة تصل حيث لا يصل المال.\nصغير العمل عند الناس قد يكون كبيرًا عند الله."},
 {t:"الرفق", b:"إِنَّ اللهَ رَفِيقٌ يُحِبُّ الرِّفْقَ،\nوَيُعْطِي عَلَى الرِّفْقِ مَا لَا يُعْطِي عَلَى الْعُنْفِ.", s:"رواه مسلم",
  n:"الرفق يفتح ما تغلقه الشدة في القلوب والأمور.\nما كان الرفق في شيء إلا زانه، ولا نزع من شيء إلا شانه.\nالقيادة بالرفق أبقى أثرًا من القيادة بالقوة."},
 {t:"حب الخير للناس", b:"لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى يُحِبَّ لِأَخِيهِ\nمَا يُحِبُّ لِنَفْسِهِ.", s:"متفق عليه",
  n:"كمال الإيمان مرتبط بسلامة الصدر من الحسد.\nمقياس عملي: قس ما تريده لغيرك بما تريده لنفسك.\nمن أحب الخير للناس عاد إليه الخير أضعافًا."},
 {t:"الدال على الخير", b:"مَنْ دَلَّ عَلَى خَيْرٍ\nفَلَهُ مِثْلُ أَجْرِ فَاعِلِهِ.", s:"رواه مسلم",
  n:"الإرشاد إلى العمل الصالح يعدل العمل نفسه في الأجر.\nنشر النافع سبب لأجر يمتد بعد صاحبه.\nلا تحقر توجيهًا صغيرًا، فقد يكون بداية طريق."},
 {t:"المسلم من سلم", b:"الْمُسْلِمُ مَنْ سَلِمَ الْمُسْلِمُونَ\nمِنْ لِسَانِهِ وَيَدِهِ.", s:"متفق عليه",
  n:"أول علامات الإسلام كفّ الأذى قبل بذل الإحسان.\nاللسان قُدّم على اليد لأن جرحه أعمق وأبقى.\nمن أمِن الناس شرّه أحبوه وأمنوه."},
 {t:"الصدقة لا تنقص المال", b:"مَا نَقَصَتْ صَدَقَةٌ مِنْ مَالٍ.", s:"رواه مسلم",
  n:"الصدقة سبب للبركة لا للفقر مهما بدا الحساب.\nما ينقص من العدد يُعوَّض بالبركة والحفظ.\nالعطاء يزيد صاحبه عزًا لا ذلًا."},
 {t:"القول الحسن أو الصمت", b:"مَنْ كَانَ يُؤْمِنُ بِاللهِ وَالْيَوْمِ الْآخِرِ\nفَلْيَقُلْ خَيْرًا أَوْ لِيَصْمُتْ.", s:"متفق عليه",
  n:"الكلام إما غنم وإما غرم، ولا ثالث لهما.\nالصمت عن الشر عبادة يغفل عنها كثيرون.\nربط الكلام بالإيمان يدل على خطر اللسان."},
 {t:"الطهور شطر الإيمان", b:"الطُّهُورُ شَطْرُ الْإِيمَانِ.", s:"رواه مسلم",
  n:"الطهارة الظاهرة عنوان الطهارة الباطنة.\nالنظافة في الإسلام عبادة لا عادة.\nمن اعتنى بطهوره اعتنى بصلاته."},
 {t:"أحب الأعمال", b:"أَحَبُّ الْأَعْمَالِ إِلَى اللهِ\nأَدْوَمُهَا وَإِنْ قَلَّ.", s:"متفق عليه",
  n:"القليل الدائم أنفع من الكثير المنقطع.\nثبات العمل دليل صدق صاحبه.\nابدأ بما تطيق الاستمرار عليه لا بما يبهر."},
 {t:"اتق الله حيثما كنت", b:"اتَّقِ اللهَ حَيْثُمَا كُنْتَ،\nوَأَتْبِعِ السَّيِّئَةَ الْحَسَنَةَ تَمْحُهَا،\nوَخَالِقِ النَّاسَ بِخُلُقٍ حَسَنٍ.", s:"رواه الترمذي",
  n:"التقوى في السر والعلن سواء.\nالخطأ لا يُعالج بالحسرة بل بحسنة تمحوه.\nحسن الخلق مع الناس تمام التقوى مع الله."},
 {t:"الدين النصيحة", b:"الدِّينُ النَّصِيحَةُ.", s:"رواه مسلم",
  n:"النصيحة إرادة الخير للمنصوح لا إظهار العيب.\nمن نصح في السر فقد نصح، ومن نصح في العلن فقد فضح.\nالدين كله يقوم على الإخلاص والصدق مع الله والخلق."},
 {t:"الزهد", b:"ازْهَدْ فِي الدُّنْيَا يُحِبَّكَ اللهُ،\nوَازْهَدْ فِيمَا عِنْدَ النَّاسِ يُحِبَّكَ النَّاسُ.", s:"رواه ابن ماجه",
  n:"الزهد ليس ترك المال بل ترك تعلّق القلب به.\nالاستغناء عما في أيدي الناس يورث المهابة والمحبة.\nمن قلّت حاجته إلى الناس قلّ ذلّه لهم."},
 {t:"لا ضرر ولا ضرار", b:"لَا ضَرَرَ وَلَا ضِرَارَ.", s:"رواه ابن ماجه",
  n:"قاعدة جامعة تحكم المعاملات والجوار والعمل.\nلا يجوز دفع الضرر عن نفسك بإيقاعه على غيرك.\nالإسلام يمنع الضرر ابتداءً ويمنع مقابلته بمثله."},
 {t:"البر حسن الخلق", b:"الْبِرُّ حُسْنُ الْخُلُقِ.", s:"رواه مسلم",
  n:"حسن الخلق ثمرة الدين لا زينة زائدة عليه.\nيبلغ صاحبه بخلقه درجة الصائم القائم.\nأثقل ما يوضع في الميزان يوم القيامة."},
 {t:"التبسم صدقة", b:"تَبَسُّمُكَ فِي وَجْهِ أَخِيكَ\nصَدَقَةٌ.", s:"رواه الترمذي",
  n:"أبواب الخير أوسع من أن تحصر في المال.\nالبِشر يزرع الألفة ويكسر الجفاء بلا كلفة.\nمن لم يملك عطاءً ملك وجهًا طلقًا."},
 {t:"التيسير على المعسر", b:"وَمَنْ يَسَّرَ عَلَى مُعْسِرٍ\nيَسَّرَ اللهُ عَلَيْهِ فِي الدُّنْيَا وَالْآخِرَةِ.", s:"رواه مسلم",
  n:"الجزاء من جنس العمل في التيسير والتعسير.\nإنظار المعسر خير من مطالبته وأبقى أجرًا.\nمن فرّج عن مكروب فرّج الله عنه يوم الكرب الأكبر."},
 {t:"الصلاة على النبي", b:"مَنْ صَلَّى عَلَيَّ صَلَاةً\nصَلَّى اللهُ عَلَيْهِ بِهَا عَشْرًا.", s:"رواه مسلم",
  n:"أيسر الأعمال وأعظمها بركة على قلة كلفتها.\nالإكثار منها يوم الجمعة وليلتها آكد.\nمن أراد أن يُذكر عند الله فليذكر نبيه بالصلاة عليه."},
 {t:"خيركم", b:"خَيْرُكُمْ مَنْ تَعَلَّمَ الْقُرْآنَ\nوَعَلَّمَهُ.", s:"رواه البخاري",
  n:"الخيرية علّقت بالجمع بين التعلم والتعليم.\nنفع الناس بالعلم أعلى من الانتفاع به وحدك.\nتعليم آية واحدة سبب لأجر ممتد."},
 {t:"الدين يسر", b:"إِنَّ الدِّينَ يُسْرٌ،\nوَلَنْ يُشَادَّ الدِّينَ أَحَدٌ إِلَّا غَلَبَهُ.", s:"رواه البخاري",
  n:"التشدد على النفس ينقطع صاحبه.\nالسداد والمقاربة خير من المغالبة."},
 {t:"الرحمة بالناس", b:"مَنْ لَا يَرْحَمِ النَّاسَ\nلَا يَرْحَمْهُ اللهُ.", s:"متفق عليه",
  n:"الرحمة شرط في نيل الرحمة.\nمن قسا على الخلق حُرم لطف الخالق."},
 {t:"الحياء", b:"الْحَيَاءُ لَا يَأْتِي إِلَّا بِخَيْرٍ.", s:"متفق عليه",
  n:"لا يقال حياء منع من حق، فذاك خجل لا حياء.\nالحياء شعبة من الإيمان."},
 {t:"الكِبر", b:"الْكِبْرُ بَطَرُ الْحَقِّ\nوَغَمْطُ النَّاسِ.", s:"رواه مسلم",
  n:"ردّ الحق تكبر، واحتقار الناس تكبر.\nالثوب الحسن ليس من الكبر في شيء."},
 {t:"قضاء الحوائج", b:"مَنْ كَانَ فِي حَاجَةِ أَخِيهِ\nكَانَ اللهُ فِي حَاجَتِهِ.", s:"متفق عليه",
  n:"سعيك لأخيك سبب لسعي الله في حاجتك.\nلا شيء أنفع لك من نفعك غيرك."},
 {t:"حق المسلم", b:"الْمُسْلِمُ أَخُو الْمُسْلِمِ،\nلَا يَظْلِمُهُ وَلَا يُسْلِمُهُ.", s:"متفق عليه",
  n:"لا يظلمه بنفسه ولا يتركه لظالم.\nالأخوة التزام لا شعار."},
 {t:"الظلم", b:"الظُّلْمُ ظُلُمَاتٌ يَوْمَ الْقِيَامَةِ.", s:"متفق عليه",
  n:"ظلمة في القلب اليوم، وظلمة في الموقف غدًا.\nأخطر الظلم ما يُستهان به لصغره."},
 {t:"الجسد الواحد", b:"مَثَلُ الْمُؤْمِنِينَ فِي تَوَادِّهِمْ وَتَرَاحُمِهِمْ\nكَمَثَلِ الْجَسَدِ الْوَاحِدِ.", s:"متفق عليه",
  n:"ألم العضو ألم للجسد كله.\nالمجتمع المؤمن يشعر بعضه ببعض."},
 {t:"البنيان", b:"الْمُؤْمِنُ لِلْمُؤْمِنِ كَالْبُنْيَانِ\nيَشُدُّ بَعْضُهُ بَعْضًا.", s:"متفق عليه",
  n:"قوة الجماعة في تماسك أفرادها.\nمن أضعف أخاه أضعف البناء كله."},
 {t:"كونوا إخوانًا", b:"لَا تَحَاسَدُوا وَلَا تَبَاغَضُوا وَلَا تَدَابَرُوا،\nوَكُونُوا عِبَادَ اللهِ إِخْوَانًا.", s:"رواه مسلم",
  n:"نهي عن أصول القطيعة قبل وقوعها.\nالحسد أول الطريق إلى البغض."},
 {t:"الهجر فوق ثلاث", b:"لَا يَحِلُّ لِمُسْلِمٍ أَنْ يَهْجُرَ أَخَاهُ فَوْقَ ثَلَاثٍ،\nوَخَيْرُهُمَا الَّذِي يَبْدَأُ بِالسَّلَامِ.", s:"متفق عليه",
  n:"للغضب مهلة، وبعدها إثم.\nالبادئ بالصلح أفضلهما لا أضعفهما."},
 {t:"كل معروف صدقة", b:"كُلُّ مَعْرُوفٍ صَدَقَةٌ.", s:"رواه البخاري",
  n:"باب الصدقة أوسع من المال.\nما نفع الناس فهو صدقة وإن قلّ."},
 {t:"اليد العليا", b:"الْيَدُ الْعُلْيَا خَيْرٌ مِنَ الْيَدِ السُّفْلَى.", s:"متفق عليه",
  n:"الاستغناء والعطاء خير من السؤال.\nابدأ بمن تعول."},
 {t:"عمل اليد", b:"مَا أَكَلَ أَحَدٌ طَعَامًا قَطُّ خَيْرًا مِنْ أَنْ يَأْكُلَ مِنْ عَمَلِ يَدِهِ.", s:"رواه البخاري",
  n:"كسب اليد أشرف المكاسب.\nلا نقص في مهنة يعف بها المرء."},
 {t:"الغش", b:"مَنْ غَشَّنَا فَلَيْسَ مِنَّا.", s:"رواه مسلم",
  n:"الغش يخرج صاحبه من هدي الجماعة.\nيشمل البيع والعمل والقول."},
 {t:"السماحة في البيع", b:"رَحِمَ اللهُ رَجُلًا سَمْحًا إِذَا بَاعَ،\nوَإِذَا اشْتَرَى، وَإِذَا اقْتَضَى.", s:"رواه البخاري",
  n:"السماحة مطلوبة في المواضع الثلاثة.\nالتشدد في الاقتضاء يفسد المودة."},
 {t:"مطل الغني", b:"مَطْلُ الْغَنِيِّ ظُلْمٌ.", s:"متفق عليه",
  n:"تأخير الحق مع القدرة ظلم لا تسويف.\nيدخل فيه تأخير أجر العامل."},
 {t:"إنظار المعسر", b:"مَنْ أَنْظَرَ مُعْسِرًا أَوْ وَضَعَ عَنْهُ،\nأَظَلَّهُ اللهُ فِي ظِلِّهِ.", s:"رواه مسلم",
  n:"الإمهال أجر، والإسقاط أعظم.\nالجزاء ظلّ يوم لا ظلّ إلا ظله."},
 {t:"سباب المسلم", b:"سِبَابُ الْمُسْلِمِ فُسُوقٌ.", s:"متفق عليه",
  n:"اللسان يجرّ إلى ما لا يُحتمل.\nالخصومة لا تبيح السب."},
 {t:"ملك النفس", b:"لَيْسَ الشَّدِيدُ بِالصُّرَعَةِ،\nإِنَّمَا الشَّدِيدُ الَّذِي يَمْلِكُ نَفْسَهُ عِنْدَ الْغَضَبِ.", s:"متفق عليه",
  n:"القوة الحقيقية ضبط لا غلبة.\nأصعب خصم على المرء نفسه."},
 {t:"لا تغضب", b:"لَا تَغْضَبْ.", s:"رواه البخاري",
  n:"وصية جامعة كررها النبي ﷺ ثلاثًا.\nأكثر الندم ثمرة لحظة غضب."},
 {t:"الصدق", b:"إِنَّ الصِّدْقَ يَهْدِي إِلَى الْبِرِّ،\nوَإِنَّ الْبِرَّ يَهْدِي إِلَى الْجَنَّةِ.", s:"متفق عليه",
  n:"الصدق عادة تُكتسب حتى يُكتب صاحبها صدّيقًا.\nوالكذب كذلك في الطرف الآخر."},
 {t:"علامة النفاق", b:"آيَةُ الْمُنَافِقِ ثَلَاثٌ:\nإِذَا حَدَّثَ كَذَبَ، وَإِذَا وَعَدَ أَخْلَفَ،\nوَإِذَا اؤْتُمِنَ خَانَ.", s:"متفق عليه",
  n:"ثلاث تُختبر بها المعاملات اليومية.\nإخلاف الوعد ليس أمرًا هينًا."},
 {t:"الحلال بيّن", b:"الْحَلَالُ بَيِّنٌ وَالْحَرَامُ بَيِّنٌ،\nوَبَيْنَهُمَا مُشْتَبِهَاتٌ.", s:"متفق عليه",
  n:"من اتقى الشبهات استبرأ لدينه وعرضه.\nالورع حماية لا تضييق."},
 {t:"الإحسان في كل شيء", b:"إِنَّ اللهَ كَتَبَ الْإِحْسَانَ عَلَى كُلِّ شَيْءٍ.", s:"رواه مسلم",
  n:"الإحسان مطلوب حتى في أشق المواضع.\nالإتقان جزء من الإحسان."},
 {t:"المؤمن القوي", b:"الْمُؤْمِنُ الْقَوِيُّ خَيْرٌ وَأَحَبُّ إِلَى اللهِ مِنَ الْمُؤْمِنِ الضَّعِيفِ،\nاحْرِصْ عَلَى مَا يَنْفَعُكَ.", s:"رواه مسلم",
  n:"القوة في البدن والرأي والعزيمة.\nالحرص على النافع مع الاستعانة بالله."},
 {t:"إكرام الجار", b:"مَنْ كَانَ يُؤْمِنُ بِاللهِ وَالْيَوْمِ الْآخِرِ\nفَلْيُكْرِمْ جَارَهُ.", s:"متفق عليه",
  n:"الإيمان يُترجم سلوكًا مع أقرب الناس دارًا.\nويليه إكرام الضيف."},
 {t:"وصية الجار", b:"مَا زَالَ جِبْرِيلُ يُوصِينِي بِالْجَارِ\nحَتَّى ظَنَنْتُ أَنَّهُ سَيُوَرِّثُهُ.", s:"متفق عليه",
  n:"حق الجوار أعظم مما يظن الناس.\nيشمل الجار غير المسلم."},
 {t:"أمن الجار", b:"لَا يُؤْمِنُ مَنْ لَا يَأْمَنُ جَارُهُ بَوَائِقَهُ.", s:"متفق عليه",
  n:"الأذى ينقض الإيمان الكامل.\nأول الجوار كفّ الشر لا بذل الخير."},
 {t:"صلة الرحم", b:"مَنْ أَحَبَّ أَنْ يُبْسَطَ لَهُ فِي رِزْقِهِ\nوَيُنْسَأَ لَهُ فِي أَثَرِهِ، فَلْيَصِلْ رَحِمَهُ.", s:"متفق عليه",
  n:"الصلة سبب في السعة والبركة.\nالواصل من يصل من قطعه."},
 {t:"الساعي على الأرملة", b:"السَّاعِي عَلَى الْأَرْمَلَةِ وَالْمِسْكِينِ\nكَالْمُجَاهِدِ فِي سَبِيلِ اللهِ.", s:"متفق عليه",
  n:"كفالة الضعيف عمل من أعلى الأعمال.\nالأجر بحسب النفع لا بحسب الشهرة."},
 {t:"كافل اليتيم", b:"أَنَا وَكَافِلُ الْيَتِيمِ فِي الْجَنَّةِ هَكَذَا.", s:"رواه البخاري",
  n:"قرب في الجنة يعدل عمرًا من الرعاية.\nالكفالة تشمل القريب والبعيد."},
 {t:"تفريج الكرب", b:"مَنْ نَفَّسَ عَنْ مُؤْمِنٍ كُرْبَةً مِنْ كُرَبِ الدُّنْيَا،\nنَفَّسَ اللهُ عَنْهُ كُرْبَةً مِنْ كُرَبِ يَوْمِ الْقِيَامَةِ.", s:"رواه مسلم",
  n:"الجزاء أعظم من العمل بكثير.\nواللهُ في عون العبد ما كان العبد في عون أخيه."},
 {t:"الدلالة على الهدى", b:"مَنْ دَعَا إِلَى هُدًى كَانَ لَهُ مِنَ الْأَجْرِ\nمِثْلُ أُجُورِ مَنْ تَبِعَهُ.", s:"رواه مسلم",
  n:"أجر ممتد ما بقي أثر الكلمة.\nوالعكس في الدعوة إلى الضلالة."},
 {t:"العمل الجاري", b:"إِذَا مَاتَ الْإِنْسَانُ انْقَطَعَ عَمَلُهُ إِلَّا مِنْ ثَلَاثٍ:\nصَدَقَةٍ جَارِيَةٍ، أَوْ عِلْمٍ يُنْتَفَعُ بِهِ،\nأَوْ وَلَدٍ صَالِحٍ يَدْعُو لَهُ.", s:"رواه مسلم",
  n:"ثلاثة أبواب تبقى بعد انقطاع العمر.\nكلها تُبنى في الحياة لا بعدها."},
 {t:"الماهر بالقرآن", b:"الْمَاهِرُ بِالْقُرْآنِ مَعَ السَّفَرَةِ الْكِرَامِ الْبَرَرَةِ،\nوَالَّذِي يَقْرَؤُهُ وَيَتَتَعْتَعُ فِيهِ لَهُ أَجْرَانِ.", s:"متفق عليه",
  n:"المشقة في التلاوة لا تنقص الأجر بل تزيده.\nلا عذر لمن يجد الحروف صعبة."},
 {t:"تعاهد القرآن", b:"تَعَاهَدُوا الْقُرْآنَ،\nفَوَالَّذِي نَفْسِي بِيَدِهِ لَهُوَ أَشَدُّ تَفَلُّتًا مِنَ الْإِبِلِ فِي عُقُلِهَا.", s:"متفق عليه",

/* ============ حساب المواقيت ============ */
function julian(y,m,d){
  if(m<=2){ y-=1; m+=12; }
  var a=Math.floor(y/100), b=2-a+Math.floor(a/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+b-1524.5;
}
function sunPos(J){
  var D=J-2451545.0, rad=Math.PI/180;
  var g=((357.529+0.98560028*D)%360)*rad;
  var q=(280.459+0.98564736*D)%360;
  var L=(((q+1.915*Math.sin(g)+0.020*Math.sin(2*g))%360)+360)%360*rad;
  var e=(23.439-0.00000036*D)*rad;
  var dec=Math.asin(Math.sin(e)*Math.sin(L));
  var RA=((Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/rad)/15+24)%24;
  var eq=q/15-RA;
  if(eq>12) eq-=24; if(eq<-12) eq+=24;
  return {dec:dec,eq:eq};
}
function hourAngle(angle,dec,lat){
  var la=lat*Math.PI/180;
  var x=(-Math.sin(angle*Math.PI/180)-Math.sin(la)*Math.sin(dec))/(Math.cos(la)*Math.cos(dec));
  if(x>1||x<-1) return null;
  return (Math.acos(x)*180/Math.PI)/15;
}
function asrAngle(factor,dec,lat){
  var la=lat*Math.PI/180;
  var a=Math.atan(1/(factor+Math.tan(Math.abs(la-dec))));
  var x=(Math.sin(a)-Math.sin(la)*Math.sin(dec))/(Math.cos(la)*Math.cos(dec));
  if(x>1||x<-1) return null;
  return (Math.acos(x)*180/Math.PI)/15;
}
/* يعيد ستة أوقات بصيغة {h,m} بنظام 12 ساعة */
function prayerTimes(y,mo,d,city,methodKey,asrFactor,ihtiyat){
  var M=METHODS[methodKey]||METHODS.mwl;
  var J=julian(y,mo,d)-city.lng/(15*24);
  var s=sunPos(J);
  var noon=12+city.tz-city.lng/15-s.eq;
  var HOR=0.833;
  var out=[];
  var fajr=noon-hourAngle(M.f,s.dec,city.lat);
  var rise=noon-hourAngle(HOR,s.dec,city.lat);
  var asr=noon+asrAngle(asrFactor,s.dec,city.lat);
  var mag=noon+hourAngle(HOR,s.dec,city.lat);
  var isha=M.min? mag+M.i/60 : noon+hourAngle(M.i,s.dec,city.lat);
  var raw=[fajr,rise,noon,asr,mag,isha];
  var adj=ihtiyat?[1,0,1,0,1,1]:[0,0,0,0,0,0];
  for(var i=0;i<6;i++){
    var mins=Math.round(raw[i]*60)+adj[i];
    mins=((mins%1440)+1440)%1440;
    var hh=Math.floor(mins/60), mm=mins%60;
    out.push({h:(hh%12)||12,m:mm});
  }
  return out;
}

var grainPat=null;
function grain(c,w,h,a){
  if(!grainPat){
    var g=document.createElement("canvas"); g.width=g.height=140;
    var gc=g.getContext("2d"), im=gc.createImageData(140,140), i;
    for(i=0;i<im.data.length;i+=4){ var v=200+Math.random()*55;
      im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=Math.random()*70; }
    gc.putImageData(im,0,0); grainPat=g;
  }
  c.save(); c.globalAlpha=a; c.globalCompositeOperation="multiply";
  c.fillStyle=c.createPattern(grainPat,"repeat"); c.fillRect(0,0,w,h); c.restore();
}
function gg(c,x0,y0,x1,y1,S){
  var g=c.createLinearGradient(x0,y0,x1,y1);
  g.addColorStop(0,S.gold2); g.addColorStop(.35,S.gold); g.addColorStop(.62,S.gold2); g.addColorStop(1,S.gold);
  return g;
}
function starPath(c,x,y,r,inner,pts,rot){
  var n=pts*2,i; c.beginPath();
  for(i=0;i<n;i++){
    var a=Math.PI/pts*i+(rot||0), rad=(i%2===0)?r:r*inner;
    var px=x+Math.cos(a)*rad, py=y+Math.sin(a)*rad;
    if(i) c.lineTo(px,py); else c.moveTo(px,py);
  }
  c.closePath();
}
function medallion(c,x,y,r,S){
  var i; c.save(); c.translate(x,y);
  for(i=0;i<16;i++){
    c.save(); c.rotate(Math.PI/8*i);
    c.beginPath(); c.moveTo(0,0);
    c.quadraticCurveTo(r*.30,-r*.34,0,-r);
    c.quadraticCurveTo(-r*.30,-r*.34,0,0); c.closePath();
    c.fillStyle=(i%2)?S.band:S.gold; c.fill();
    c.strokeStyle=S.gold2; c.lineWidth=1.4; c.stroke(); c.restore();
  }
  starPath(c,0,0,r*.42,.44,8,-Math.PI/8); c.fillStyle=S.band2; c.fill();
  c.strokeStyle=gg(c,-r,-r,r,r,S); c.lineWidth=3; c.stroke();
  c.beginPath(); c.arc(0,0,r*.14,0,Math.PI*2); c.fillStyle=S.gold2; c.fill();
  c.restore();
}
function plait(c,x,y,len,h,S,vert){
  c.save(); c.translate(x,y); if(vert) c.rotate(Math.PI/2);
  c.fillStyle=S.band; c.fillRect(0,-h/2,len,h);
  var per=h*1.35, amp=h*0.30, t, dir, i;
  for(dir=0;dir<2;dir++){
    c.beginPath();
    for(t=0;t<=len;t+=6){
      var yy=(dir?1:-1)*amp*Math.sin(t/per*Math.PI);
      if(t===0) c.moveTo(t,yy); else c.lineTo(t,yy);
    }
    c.lineCap="round";
    c.lineWidth=h*0.30; c.strokeStyle="rgba(0,0,0,.35)"; c.stroke();
    c.lineWidth=h*0.20; c.strokeStyle=gg(c,0,-h,len,h,S); c.stroke();
  }
  for(i=0;i*per<=len;i++){ starPath(c,i*per,0,h*0.26,.45,8,0); c.fillStyle=S.gold2; c.fill(); }
  c.strokeStyle=S.gold; c.lineWidth=2; c.strokeRect(0,-h/2,len,h);
  c.restore();
}
function tessellation(c,w,h,color,alpha,step){
  c.save(); c.globalAlpha=alpha; c.strokeStyle=color; c.lineWidth=2;
  for(var y=0;y<h+step;y+=step)
    for(var x=((y/step)|0)%2?step/2:0;x<w+step;x+=step){
      starPath(c,x,y,step*0.44,.42,8,0); c.stroke();
      starPath(c,x,y,step*0.22,.42,8,Math.PI/8); c.stroke();
    }
  c.restore();
}

function tileBand(c,x,y,w,h,S){
  c.save();

  var step=h, n, cx, cy, i=0;

    starPath(c,cx,cy,h*0.44,.42,8,0); c.fillStyle=(i%2)?S.band:S.band2; c.fill();
    c.strokeStyle=S.gold; c.lineWidth=2.5; c.stroke();
    starPath(c,cx,cy,h*0.20,.42,8,Math.PI/8); c.fillStyle=S.gold2; c.fill(); i++;
  }
  c.restore();
}
function tileBandV(c,x,y,w,h,S){

/* إطار مفصّص */
function scallop(c,x,y,w,h,r,S){
  var i,n;
  c.beginPath(); c.moveTo(x+r,y);
  n=Math.round(w/(r*2));
  for(i=0;i<n;i++) c.arc(x+r+i*(w/n),y,(w/n)/2,Math.PI,0,false);
  c.lineTo(x+w,y+h-r);
  n=Math.round(h/(r*2));
  for(i=0;i<n;i++) c.arc(x+w,y+r+i*(h/n),(h/n)/2,-Math.PI/2,Math.PI/2,false);
  c.lineTo(x+r,y+h);
  n=Math.round(w/(r*2));
  for(i=n;i>0;i--) c.arc(x+i*(w/n)-(w/n)/2,y+h,(w/n)/2,0,Math.PI,false);
  c.lineTo(x,y+r);
  n=Math.round(h/(r*2));
  for(i=n;i>0;i--) c.arc(x,y+i*(h/n)-(h/n)/2,(h/n)/2,Math.PI/2,-Math.PI/2,false);
  c.closePath();
  c.fillStyle=S.band; c.fill();
  c.strokeStyle=gg(c,x,y,x+w,y+h,S); c.lineWidth=5; c.stroke();
}
function wrap(c,t,maxW){
  var out=[];
  String(t||"").split("\n").forEach(function(p){
    if(!p.trim()){ out.push(""); return; }
    var ws=p.trim().split(/\s+/), line="";
    ws.forEach(function(w){
      var test=line?line+" "+w:w;
      if(c.measureText(test).width>maxW&&line){ out.push(line); line=w; } else line=test;
    });
    if(line) out.push(line);
  });
  return out;
}
function fit(c,t,maxW,maxH,mx,mn,lh,wt){
  for(var s=mx;s>=mn;s-=2){
    c.font=(wt||"")+s+"px "+AR;
    var L=wrap(c,t,maxW);
    if(L.length*s*lh<=maxH) return {size:s,lines:L};
  }
  c.font=(wt||"")+mn+"px "+AR;
  return {size:mn,lines:wrap(c,t,maxW)};
}
function lines(c,L,cx,y,s,lh,color){
  c.textAlign="center";
  L.forEach(function(l,i){ c.fillStyle=(typeof color==="function")?color(i):color; c.fillText(l,cx,y+i*s*lh); });
}
var photoImg=null;
function photoBG(c,w,h){

    c.drawImage(photoImg,(w-photoImg.width*r)/2,(h-photoImg.height*r)/2,photoImg.width*r,photoImg.height*r);

  s.addColorStop(0,"rgba(6,10,14,.82)"); s.addColorStop(.45,"rgba(6,10,14,.55)"); s.addColorStop(1,"rgba(6,10,14,.88)");

}

/* ============ عناصر المسجد ============ */
function dome(c,cx,base,w,h,fill,gold){
  var hw=w/2;
  c.beginPath(); c.moveTo(cx-hw,base);
  c.bezierCurveTo(cx-hw*1.06,base-h*.42,cx-hw*.86,base-h*.72,cx,base-h);
  c.bezierCurveTo(cx+hw*.86,base-h*.72,cx+hw*1.06,base-h*.42,cx+hw,base);
  c.closePath(); c.fillStyle=fill; c.fill();
  c.strokeStyle=gold; c.lineWidth=4; c.stroke();
  c.beginPath(); c.moveTo(cx,base-h); c.lineTo(cx,base-h-46); c.lineWidth=6; c.stroke();
  c.beginPath(); c.arc(cx,base-h-70,20,Math.PI*.28,Math.PI*1.72); c.lineWidth=7; c.stroke();
}
function minaret(c,x,base,hh,fill,gold){
  c.fillStyle=fill; c.fillRect(x-15,base-hh,30,hh);
  c.fillRect(x-26,base-hh*.62,52,16);
  c.strokeStyle=gold; c.lineWidth=3; c.strokeRect(x-26,base-hh*.62,52,16);
  c.beginPath(); c.moveTo(x-18,base-hh); c.quadraticCurveTo(x,base-hh-58,x+18,base-hh); c.closePath();
  c.fill(); c.stroke();
  c.beginPath(); c.moveTo(x,base-hh-58); c.lineTo(x,base-hh-84); c.stroke();
}

/* ============ الواجهة ============ */
var cv1=document.createElement("canvas"); cv1.width=W1; cv1.height=H1;
var cv2=document.createElement("canvas"); cv2.width=W2; cv2.height=H2;
var x1=cv1.getContext("2d"), x2=cv2.getContext("2d");
function $(i){ return document.getElementById(i); }
var styleKey=DAY_STYLE[new Date().getDay()], ribbonIdx=0, hadithIdx=0, msgIdx=0;

function pickedDate(){
  var v=$("f_date").value, p=v?v.split("-"):null;
  if(!p||p.length!==3) return new Date();
  return new Date(+p[0],+p[1]-1,+p[2]);
}
function isoToday(){
  var d=new Date();
  return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
}
function city(){ return CITIES[$("f_city").selectedIndex]||CITIES[0]; }
function dayIdx(dt){ return Math.floor(Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())/86400000); }
var manualDate="";
function markManual(){ manualDate=$("f_date").value; }
function applyAuto(){
  if(!$("f_autocontent").checked){
    if(manualDate===$("f_date").value) return;
    $("f_autocontent").checked=true;
  }
  var k=dayIdx(pickedDate());
  useHadith(((k%HADITHS.length)+HADITHS.length)%HADITHS.length,true);
  useMsg(((k%MESSAGES.length)+MESSAGES.length)%MESSAGES.length,true);
}
function dateString(){
  var d=pickedDate(), off=parseInt($("f_hijriAdj").value,10)||0;
  var hd=new Date(d.getTime()+off*86400000), h=hijri(hd);
  return DAYS[d.getDay()]+" : "+(h?h+" ـ ":"")+pad(d.getDate())+"/"+MON[d.getMonth()]+"/"+d.getFullYear()+" م";
}
function defaultRibbon(){
  var dw=pickedDate().getDay();
  return DAY_RIBBON[dw]||RIBBONS[0];
}
function readTimes(){
  var out=[],i,h,m;
  for(i=0;i<6;i++){
    h=parseInt($("h"+i).value,10); m=parseInt($("m"+i).value,10);
    if(isNaN(h)) h=12; if(isNaN(m)) m=0;
    out.push(h+"."+(m<10?"0":"")+m);
  }
  return out;
}
function writeTimes(list){
  for(var i=0;i<6;i++){ $("h"+i).value=list[i].h; $("m"+i).value=pad(list[i].m); }
}
function recalc(){
  var d=pickedDate(), c=city();
  var list=prayerTimes(d.getFullYear(),d.getMonth()+1,d.getDate(),c,
    $("f_method").value,parseInt($("f_asr").value,10),$("f_ihtiyat").value==="1");
  writeTimes(list);
  $("calcNote").textContent="محسوبة لـ"+c.n+" حسب "+METHODS[$("f_method").value].label+
    (c.tz!==3?" (توقيت +"+c.tz+")":"")+". عدّل أي وقت يدويًا عند الحاجة.";
}
function readState(){
  return { head:$("f_head").value, body:$("f_body").value, src:$("f_src").value, notes:$("f_notes").value,
    multi:$("f_multi").value, cityIdx:$("f_city").selectedIndex, date:dateString(), iso:$("f_date").value,
    method:$("f_method").value, asr:$("f_asr").value, ihtiyat:$("f_ihtiyat").value, hijriAdj:$("f_hijriAdj").value,
    times:readTimes(), msg:$("f_msg").value, ribbon:$("f_ribbon").value,
    styleKey:styleKey, autoStyle:$("f_autostyle").checked, autoRibbon:$("f_autoribbon").checked,
    autoContent:$("f_autocontent").checked, manualDate:manualDate };
}
function applyState(s){
  $("f_head").value=s.head; $("f_body").value=s.body; $("f_src").value=s.src; $("f_notes").value=s.notes;
  $("f_multi").value=s.multi;
  $("f_city").selectedIndex=(typeof s.cityIdx==="number")?s.cityIdx:0;
  $("f_date").value=isoToday();
  $("f_method").value=s.method||city().m;
  $("f_asr").value=s.asr||"1";
  $("f_ihtiyat").value=s.ihtiyat||"1";
  $("f_hijriAdj").value=s.hijriAdj||"0";
  $("f_msg").value=s.msg;
  $("f_autostyle").checked=s.autoStyle!==false;
  $("f_autoribbon").checked=s.autoRibbon!==false;
  $("f_autocontent").checked=s.autoContent!==false;
  if(s.manualDate!==undefined) manualDate=s.manualDate;
  $("f_ribbon").value=$("f_autoribbon").checked?defaultRibbon():(s.ribbon||defaultRibbon());
  styleKey=$("f_autostyle").checked?DAY_STYLE[pickedDate().getDay()]:(s.styleKey||styleKey);
  markStyle(); recalc(); applyAuto();
}
function markStyle(){
  Array.prototype.forEach.call($("styleBar").children,function(b){
    b.setAttribute("aria-pressed",b.dataset.k===styleKey);
  });
  $("photoBox").hidden=!STYLES[styleKey].photo;
}
var timer=null;
function render(){
  var s=readState(), S=STYLES[styleKey];
  var d={ head:s.head, body:s.body, src:s.src, notes:s.notes, multi:s.multi,
          city:CITIES[s.cityIdx].n, date:s.date, times:s.times, msg:s.msg, ribbon:s.ribbon };
  x1.clearRect(0,0,W1,H1); x2.clearRect(0,0,W2,H2);
  card1(x1,S,d); card2(x2,S,d);
  $("img1").src=cv1.toDataURL("image/png");
  $("img2").src=cv2.toDataURL("image/png");
}
function schedule(){ clearTimeout(timer); timer=setTimeout(function(){ render(); save(); },220); }

/* التخزين */
var KEY="two-cards:v3";
function fbSet(v){ try{ window.localStorage.setItem(KEY,v); return true; }catch(e){ return false; } }
function fbGet(){ try{ return window.localStorage.getItem(KEY); }catch(e){ return null; } }
function save(){
  if(!$("f_auto").checked) return;
  var v=JSON.stringify(readState()), done=false;
  function ok(){ var el=$("saved"); el.textContent="تم الحفظ";
    setTimeout(function(){ if(el.textContent==="تم الحفظ") el.textContent=""; },1400); }
  try{
    if(window.storage&&window.storage.set){
      window.storage.set(KEY,v).then(ok)["catch"](function(){ if(fbSet(v)) ok(); }); done=true;
    }
  }catch(e){}
  if(!done&&fbSet(v)) ok();
}
function load(){
  return new Promise(function(res){
    function fin(r){ try{ res(r?JSON.parse(r):null); }catch(e){ res(null); } }
    try{
      if(window.storage&&window.storage.get){
        window.storage.get(KEY).then(function(r){ fin(r&&r.value?r.value:fbGet()); })["catch"](function(){ fin(fbGet()); });
        return;
      }
    }catch(e){}
    fin(fbGet());
  });
}

/* التصدير */
function stamp(){ var d=pickedDate(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function toBlob(cv){ return new Promise(function(r){ cv.toBlob(r,"image/png"); }); }
function dl(b,n){ var u=URL.createObjectURL(b), a=document.createElement("a");
  a.href=u; a.download=n; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(u); },3000); }
$("btnDl").onclick=function(){
  render();
  toBlob(cv1).then(function(b){ dl(b,"hadith-"+stamp()+".png"); return toBlob(cv2); })
    .then(function(b){ setTimeout(function(){ dl(b,"prayer-"+stamp()+".png"); },700); });
};
$("btnShare").onclick=function(){
  render();
  Promise.all([toBlob(cv1),toBlob(cv2)]).then(function(bs){
    try{
      var f=[new File([bs[0]],"hadith-"+stamp()+".png",{type:"image/png"}),
             new File([bs[1]],"prayer-"+stamp()+".png",{type:"image/png"})];
      if(navigator.canShare&&navigator.canShare({files:f})){ navigator.share({files:f})["catch"](function(){}); return; }
    }catch(e){}
    $("saved").textContent="المشاركة غير مدعومة هنا. استخدم التنزيل أو الضغط المطول على الصورة.";
  });
};
$("btnReset").onclick=function(){
  var s=JSON.parse(JSON.stringify(DEF));
  s.autoStyle=true; s.autoRibbon=true; s.autoContent=true; s.cityIdx=0;
  applyState(s); render(); save();
};

/* حقول المواقيت */
(function buildTimes(){
  var box=$("timesBox"), i;
  for(i=0;i<6;i++){
    var cell=document.createElement("div");
    cell.className="tcell";
    cell.innerHTML='<label for="h'+i+'">'+LABELS[i].replace(/ـ/g,"")+'</label>'+
      '<div class="hm"><input type="number" id="h'+i+'" min="1" max="12" inputmode="numeric">'+
      '<span>:</span><input type="number" id="m'+i+'" min="0" max="59" inputmode="numeric"></div>';
    box.appendChild(cell);
  }
})();

/* المكتبات */
HADITHS.forEach(function(h,i){
  var o=document.createElement("option"); o.value=String(i); o.textContent=h.t; $("f_lib").appendChild(o);
});
function useHadith(i,auto){
  hadithIdx=i; $("f_lib").selectedIndex=i;
  $("f_body").value=HADITHS[i].b; $("f_src").value=HADITHS[i].s; $("f_notes").value=HADITHS[i].n;
  if(!auto){ $("f_autocontent").checked=false; markManual(); }
  schedule();
}
$("f_lib").onchange=function(){ useHadith(this.selectedIndex); };
$("btnNextHadith").onclick=function(){ useHadith((hadithIdx+1)%HADITHS.length); };

MESSAGES.forEach(function(m,i){
  var o=document.createElement("option"); o.value=String(i);
  o.textContent=m.length>34?m.slice(0,34)+"…":m; $("f_msgLib").appendChild(o);
});
function useMsg(i,auto){ msgIdx=i; $("f_msgLib").selectedIndex=i; $("f_msg").value=MESSAGES[i];
  if(!auto){ $("f_autocontent").checked=false; markManual(); } schedule(); }
$("f_autocontent").onchange=function(){ if(this.checked) applyAuto(); else schedule(); };
$("f_msgLib").onchange=function(){ useMsg(this.selectedIndex); };
$("btnNextMsg").onclick=function(){ useMsg((msgIdx+1)%MESSAGES.length); };
$("btnRibbon").onclick=function(){
  ribbonIdx=(ribbonIdx+1)%RIBBONS.length;
  $("f_ribbon").value=RIBBONS[ribbonIdx];
  $("f_autoribbon").checked=false; schedule();
};

/* المدن */
CITIES.forEach(function(c){
  var o=document.createElement("option"); o.textContent=c.n; $("f_city").appendChild(o);
});
$("f_city").onchange=function(){ $("f_method").value=city().m; recalc(); schedule(); };
$("f_date").onchange=function(){
  if($("f_autostyle").checked){ styleKey=DAY_STYLE[pickedDate().getDay()]; markStyle(); }
  if($("f_autoribbon").checked) $("f_ribbon").value=defaultRibbon();
  applyAuto(); recalc(); schedule();
};
["f_method","f_asr","f_ihtiyat"].forEach(function(id){
  $(id).onchange=function(){ recalc(); schedule(); };
});
$("f_hijriAdj").onchange=schedule;
$("btnRecalc").onclick=function(){ recalc(); schedule(); };

$("f_photo").onchange=function(e){
  var f=e.target.files&&e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ var im=new Image(); im.onload=function(){ photoImg=im; render(); }; im.src=r.result; };
  r.readAsDataURL(f);
};

/* الأنماط */
Object.keys(STYLES).forEach(function(k){
  var b=document.createElement("button");
  b.dataset.k=k;
  b.innerHTML=STYLES[k].name+' <span class="d">'+STYLES[k].day+'</span>';
  b.onclick=function(){ styleKey=k; $("f_autostyle").checked=false; markStyle(); schedule(); };
  $("styleBar").appendChild(b);
});
$("f_autostyle").onchange=function(){
  if(this.checked){ styleKey=DAY_STYLE[pickedDate().getDay()]; markStyle(); }
  schedule();
};
$("f_autoribbon").onchange=function(){
  if(this.checked) $("f_ribbon").value=defaultRibbon();
  schedule();
};

function tabTo(n){
  $("tab1").setAttribute("aria-selected",n===1); $("tab2").setAttribute("aria-selected",n===2);
  $("sheet1").classList.toggle("on",n===1); $("sheet2").classList.toggle("on",n===2);
}
$("tab1").onclick=function(){ tabTo(1); };
$("tab2").onclick=function(){ tabTo(2); };

["f_body","f_src","f_notes","f_msg"].forEach(function(id){
  $(id).addEventListener("input",function(){ $("f_autocontent").checked=false; markManual(); });
});
["f_head","f_body","f_src","f_notes","f_multi","f_msg","f_ribbon",
 "h0","h1","h2","h3","h4","h5","m0","m1","m2","m3","m4","m5"].forEach(function(id){
  $(id).addEventListener("input",schedule); $(id).addEventListener("change",schedule);
});

(function start(){
  var s=JSON.parse(JSON.stringify(DEF));
  s.autoStyle=true; s.autoRibbon=true; s.cityIdx=0;
  applyState(s);
  load().then(function(saved){
    if(saved){ applyState(saved); }
    var go=function(){ render(); };
    if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(go); setTimeout(go,1600); } else go();
  });
})();
})();

</script>
</body>
</html>
