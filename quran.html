  @font-face{font-family:"Scheherazade New";src:url("font-sheh-400.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Scheherazade New";src:url("font-sheh-700.woff2") format("woff2");font-weight:700;font-display:swap}
  @font-face{font-family:"Cairo";src:url("font-cairo-400.woff2") format("woff2");font-weight:400;font-display:swap}
  @font-face{font-family:"Cairo";src:url("font-cairo-600.woff2") format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:"Cairo";src:url("font-cairo-700.woff2") format("woff2");font-weight:700;font-display:swap}
  :root{--ink:#1C2B26;--soft:#4E5F58;--paper:#F2F0E8;--card:#FBFAF6;--gold:#A8802F;--green:#2E7D4F;--line:rgba(28,43,38,.14)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cairo",system-ui,sans-serif;-webkit-text-size-adjust:100%}
  header{padding:13px 18px 9px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
  header h1{font-family:"Amiri",serif;font-size:23px;margin:0}
  header .sub{font-size:12px;color:var(--soft)}
  .wrap{max-width:1180px;margin:0 auto;padding:16px 16px 130px;display:grid;grid-template-columns:1fr;gap:20px}
  @media(min-width:960px){.wrap{grid-template-columns:minmax(0,1fr) 430px;align-items:start;padding-bottom:40px}.panel{position:sticky;top:76px}}
  .stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
  .stage img{width:100%;height:auto;display:block;border-radius:10px;background:#fff}
  .quick{display:flex;gap:8px;margin-top:12px}
  .quick button{flex:1;padding:15px 10px;border-radius:13px;border:0;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
  #btnShuffle{background:var(--gold);color:#1B1405}
  #btnToday{background:var(--ink);color:#F2EFE2}
  .hint{font-size:12px;color:var(--soft);margin:10px 2px 0;line-height:1.7}
  .seg{display:flex;align-items:center;gap:6px;margin:0 0 10px;background:#E9E6DB;border:1px solid var(--line);border-radius:12px;padding:5px}
  .seg span{font-size:12.5px;color:var(--soft);padding:0 8px;white-space:nowrap}
  .seg button{flex:1;padding:9px 6px;border-radius:9px;border:0;background:transparent;color:var(--soft);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#F2EFE2}
  #err{display:none;background:#8C2F26;color:#fff;padding:12px;border-radius:10px;font-size:13px;line-height:1.7;margin-bottom:10px;white-space:pre-wrap}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
  fieldset{border:0;padding:0;margin:0 0 16px}
  legend{font-family:"Amiri",serif;font-size:18px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--gold);width:100%}

  input[type=text],textarea,select,input[type=date],input[type=number]{width:100%;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none}
  textarea{min-height:92px;resize:vertical;line-height:2;font-family:"Scheherazade New","Amiri",serif;font-size:19px}
  textarea[readonly],input[readonly]{background:#F1EFE7;color:#59635C}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2>div{min-width:0}
  .row{display:flex;gap:8px;align-items:flex-end}.row>div{flex:1}

  .hm span{font-weight:700;opacity:.45}

  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
  .btn.gold{background:var(--gold);border-color:var(--gold);color:#1B1405}
  .btn.send{background:#1E7A4D;border-color:#1E7A4D;color:#FFF}

<body>

<header>
  <h1>مِيقات</h1>
  <div class="sub">آية وحديث ودعاء ومواقيت الصلاة في صورة واحدة.</div>
</header>

<div class="wrap">
  <main>
    <div class="stage">
      <div id="err"></div>
      <div class="seg" id="dateSeg">
        <span>تاريخ البطاقة</span>
        <button type="button" data-v="0">اليوم</button>
        <button type="button" data-v="1">الغد</button>
      </div>
      <select id="f_shift" hidden><option value="0">اليوم</option><option value="1">الغد</option></select>
      <img id="out" alt="معاينة البوستر">
    </div>
  </main>

  <aside class="panel">
    <fieldset>
      <legend>المحتوى</legend>
      <div class="check">
        <input type="checkbox" id="f_auto" checked>
        <label for="f_auto" style="margin:0">محتوى اليوم تلقائيًا (يتبدل كل يوم)</label>
      </div>
      <label for="f_palette">ألوان البطاقة</label>
      <select id="f_palette">
        <option value="zaytoon">زيتي (الأصل)</option>
        <option value="layl">أزرق ليلي</option>
        <option value="bunni">بنّي دافئ</option>
        <option value="fahmi">فحمي وذهبي</option>
        <option value="wardi">عنّابي هادئ</option>
      </select>
      <label for="f_show">ما يظهر في البطاقة</label>
      <select id="f_show">
        <option value="vh">آية وحديث</option>
        <option value="v">آية فقط</option>
        <option value="h">حديث فقط</option>
      </select>
      <label for="f_cat">الموضوع</label>
      <select id="f_cat"></select>

      <div class="lockrow">
        <label for="f_verse">الآية</label>
        <button class="btn ghost sm" id="btnLock" type="button">فتح للتعديل</button>
      </div>
      <select id="f_vsel"></select>
      <textarea id="f_verse" readonly style="margin-top:8px"></textarea>
      <input type="text" id="f_vref" readonly style="margin-top:8px">
      <p class="warn" id="editWarn" hidden>الحقل مفتوح. الصق نص الآية من مصحف موثوق وتحقق من الحركات ورقم الآية.</p>

      <label for="f_hsel">الحديث</label>
      <select id="f_hsel"></select>
      <textarea id="f_hadith" style="margin-top:8px"></textarea>
      <input type="text" id="f_href" style="margin-top:8px">

      <label for="f_dsel">الدعاء</label>
      <select id="f_dsel"></select>
      <textarea id="f_dua" style="min-height:76px;margin-top:8px"></textarea>

      <label for="f_refl">سطر التأمل (يظهر فوق التوقيع)</label>
      <textarea id="f_refl" style="min-height:70px"></textarea>

      <label for="f_sign">التوقيع (يُحفظ في هذا الجهاز)</label>
      <input type="text" id="f_sign" placeholder="اسمك أو كنيتك">
    </fieldset>

    <fieldset>
      <legend>المكان والتاريخ</legend>
      <div class="g2">
        <div><label for="f_city">المدينة</label><select id="f_city"></select></div>
        <div><label for="f_date">التاريخ</label><input type="date" id="f_date"></div>
      </div>
      <div class="g2">
        <div><label for="f_method">طريقة الحساب</label><select id="f_method"></select></div>
        <div><label for="f_asr">العصر</label>
          <select id="f_asr"><option value="1">الجمهور</option><option value="2">الحنفي</option></select></div>
      </div>
      <div class="g2">
        <div><label for="f_hijriAdj">تعديل الهجري</label>
          <select id="f_hijriAdj"><option value="-1">يوم أقل</option><option value="0" selected>بلا تعديل</option><option value="1">يوم أكثر</option></select></div>
        <div><label for="f_ihtiyat">احتياط دقيقة</label>
          <select id="f_ihtiyat"><option value="1">نعم</option><option value="0">لا</option></select></div>
      </div>
      <p class="hint" id="calcNote"></p>
    </fieldset>

    <fieldset>
      <legend>المواقيت</legend>
      <div class="times" id="timesBox"></div>
      <button class="btn ghost sm" id="btnRecalc" type="button" style="margin-top:10px">إعادة الحساب</button>
    </fieldset>

    <div class="check">
      <input type="checkbox" id="f_autosave" checked>
      <label for="f_autosave" style="margin:0">حفظ تلقائي</label>
    </div>
    <button class="btn ghost sm" id="btnReset" type="button" style="margin-top:12px">استعادة الإعدادات</button>
    <p class="saved" id="saved"></p>
    <p class="ver">فكرة: سري مزيد &nbsp;·&nbsp; تطوير: ماجد المسموم &nbsp;·&nbsp; نسخة 3.6</p>

    <div class="actions">
      <button class="btn gold" id="btnShuffle" type="button">بطاقة أخرى</button>
      <button class="btn" id="btnToday" type="button">بطاقة اليوم</button>
      <button class="btn send" id="btnShare">مشاركة</button>
    </div>
  </aside>
</div>

<script src="content.js"></script>

<script>
(function(){

var CATEGORIES=THEMES;

 "zaytoon":{n:"زيتي (الأصل)",INK:"#1C2B26",GOLD:"#A8802F",GOLD2:"#D8B267",NIGHT:"#243440",

 "wardi":{n:"عنّابي هادئ",INK:"#33202A",GOLD:"#9B6F3A",GOLD2:"#D0A96E",NIGHT:"#2E1C26",

};

  INK=P.INK; GOLD=P.GOLD; GOLD2=P.GOLD2; NIGHT=P.NIGHT; DAWN=P.DAWN; DAYC=P.DAYC;
  MUT=P.MUT; ACC=P.ACC; GREEN=P.GREEN; BG1=P.BG1; BG2=P.BG2;
  PILLBG=P.PILLBG; BADGE=P.BADGE; DUAC=P.DUAC; REFLC=P.REFLC;
}
var LAB=["الفجر","الشروق","الظهر","العصر","المغرب","العشاء"];
var DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var MON_SHAM=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"];
var MON_WEST=["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
var SHAM_LANDS=["سوريا","الأردن","العراق","لبنان","فلسطين","تركيا"];
var EXPORTING=false;

/* ============ التاريخ والحساب ============ */
function pad(n){ return (n<10?"0":"")+n; }
function hijri(d){
  try{
    var p=new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"long",year:"numeric"}).formatToParts(d),o={};
    p.forEach(function(x){ o[x.type]=x.value; });
    return parseInt(o.day,10)+" "+String(o.month).replace("هـ","").trim()+" "+String(o.year).replace(/\D/g,"")+" هـ";
  }catch(e){ return ""; }
}
function julian(y,m,d){
  if(m<=2){ y-=1; m+=12; }
  var a=Math.floor(y/100), b=2-a+Math.floor(a/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+b-1524.5;
}
function sunPos(J){
  var Dd=J-2451545.0, rad=Math.PI/180;
  var g=((357.529+0.98560028*Dd)%360)*rad;
  var q=(280.459+0.98564736*Dd)%360;
  var L=(((q+1.915*Math.sin(g)+0.020*Math.sin(2*g))%360)+360)%360*rad;
  var e=(23.439-0.00000036*Dd)*rad;
  var dec=Math.asin(Math.sin(e)*Math.sin(L));
  var RA=((Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/rad)/15+24)%24;
  var eq=q/15-RA;
  if(eq>12) eq-=24; if(eq<-12) eq+=24;
  return {dec:dec,eq:eq};
}
function hourAngle(angle,dec,lat){
  var la=lat*Math.PI/180;
  var x=(-Math.sin(angle*Math.PI/180)-Math.sin(la)*Math.sin(dec))/(Math.cos(la)*Math.cos(dec));
  if(x>1||x<-1) return null;
  return (Math.acos(x)*180/Math.PI)/15;
}
function asrAngle(f,dec,lat){
  var la=lat*Math.PI/180;
  var a=Math.atan(1/(f+Math.tan(Math.abs(la-dec))));
  var x=(Math.sin(a)-Math.sin(la)*Math.sin(dec))/(Math.cos(la)*Math.cos(dec));
  if(x>1||x<-1) return null;
  return (Math.acos(x)*180/Math.PI)/15;
}
function prayerHours(y,mo,d,city,mk,asrF,ih){
  var M=METHODS[mk]||METHODS[city.m];
  var J=julian(y,mo,d)-city.lng/(15*24), s=sunPos(J);
  var noon=12+city.tz-city.lng/15-s.eq, HOR=0.833;
  var mag=noon+hourAngle(HOR,s.dec,city.lat);
  var raw=[noon-hourAngle(M.f,s.dec,city.lat), noon-hourAngle(HOR,s.dec,city.lat), noon,
           noon+asrAngle(asrF,s.dec,city.lat), mag,
           M.min? mag+M.i/60 : noon+hourAngle(M.i,s.dec,city.lat)];
  var adj=ih?[1,0,1,0,1,1]:[0,0,0,0,0,0], out=[], i;
  for(i=0;i<6;i++){
    var mins=Math.round(raw[i]*60)+adj[i];
    mins=((mins%1440)+1440)%1440;
    out.push(mins/60);
  }
  return out;
}
function h12(h){ var m=Math.round(h*60), hh=Math.floor(m/60)%24; return {h:(hh%12)||12,m:m%60}; }
function tstr(o){ return o.h+"."+(o.m<10?"0":"")+o.m; }

/* ============ أدوات الرسم ============ */
function star8(c,x,y,r,inner,rot){
  var i; c.beginPath();
  for(i=0;i<16;i++){
    var a=Math.PI/8*i+(rot||0), rad=(i%2===0)?r:r*inner;
    var px=x+Math.cos(a)*rad, py=y+Math.sin(a)*rad;
    if(i) c.lineTo(px,py); else c.moveTo(px,py);
  }
  c.closePath();
}
function ang(h){ return (h/24)*Math.PI*2-Math.PI/2; }
function chordW(cy,rIn,y,pad2){
  var dy=Math.abs(y-cy);
  if(dy>=rIn) return 0;
  return 2*Math.sqrt(rIn*rIn-dy*dy)-(pad2||80);
}
function wrapPlain(c,t,mw){
  var o=[], ws=String(t).trim().split(/\s+/), line="";
  ws.forEach(function(w){ var x=line?line+" "+w:w;
    if(c.measureText(x).width>mw&&line){ o.push(line); line=w; } else line=x; });
  if(line) o.push(line); return o;
}
/* يضيّق عرض اللف تدريجيًا ما دام عدد الأسطر ثابتًا، لتفادي بقاء
   كلمة واحدة في السطر الأخير، دون تصغير الخط. */
function balancePlain(c,t,mw){
  var base=wrapPlain(c,t,mw), n=base.length;
  if(n<2 || base[n-1].trim().split(/\s+/).length>1) return base;
  for(var w=mw*0.97; w>mw*0.60; w-=mw*0.03){
    var L=wrapPlain(c,t,w);
    if(L.length!==n) break;
    if(L[L.length-1].trim().split(/\s+/).length>1) return L;
  }
  return base;
}
function fitPlain(c,t,mw,mh,mx,mn,lh,fam,wt){

/* يوزّع نصًّا واحدًا داخل الدائرة. squeeze يضيّق عرض السطر لتفادي
   بقاء كلمة واحدة في السطر الأخير، دون تصغير الخط. */
function layoutItem(c,it,cy,rIn,startY,scale,squeeze){
  var out=[], y=startY, k;
  var size=Math.max(15,Math.round(it.size*scale)), lh=it.lh||1.72;
  c.font=(it.wt||"")+size+"px "+(it.fam||SH);
  var words=String(it.t).trim().split(/\s+/), line="";
  for(k=0;k<words.length;k++){
    var mw=chordW(cy,rIn,y+size*0.5,it.pad||80)*squeeze;
    if(mw<170) mw=170;
    var test=line?line+" "+words[k]:words[k];
    if(c.measureText(test).width>mw&&line){
      out.push({t:line,y:y,size:size,fam:it.fam||SH,wt:it.wt||"",color:it.color});
      y+=size*lh; line=words[k];
    } else line=test;
  }
  if(line){ out.push({t:line,y:y,size:size,fam:it.fam||SH,wt:it.wt||"",color:it.color}); y+=size*lh; }
  return {lines:out,y:y+(it.after||0)*scale};
}
function orphan(L){ return L.length>1 && L[L.length-1].trim().split(/\s+/).length<=1; }
function layoutMass(c,items,cy,rIn,startY,scale){
  var out=[], y=startY, i;
  for(i=0;i<items.length;i++){
    var it=items[i];
    var best=layoutItem(c,it,cy,rIn,y,scale,1);
    if(orphan(best.lines.map(function(o){return o.t;}))){
      var n=best.lines.length, q;
      for(q=0.97;q>=0.62;q-=0.03){
        var tryR=layoutItem(c,it,cy,rIn,y,scale,q);
        if(tryR.lines.length!==n) break;            /* زاد عدد الأسطر: توقف */
        if(!orphan(tryR.lines.map(function(o){return o.t;}))){ best=tryR; break; }
      }
    }
    out=out.concat(best.lines); y=best.y;
  }
  return {lines:out,total:y-startY};
}
function petalRing(c,x,y,r,n,rot){

    c.save(); c.translate(x,y); c.rotate((rot||0)+Math.PI*2/n*i);
    c.beginPath(); c.moveTo(0,0);
    c.bezierCurveTo(r*0.30,-r*0.32,r*0.30,-r*0.78,0,-r);
    c.bezierCurveTo(-r*0.30,-r*0.78,-r*0.30,-r*0.32,0,0);
    c.closePath(); c.strokeStyle=GOLD; c.lineWidth=1.4; c.stroke(); c.restore();
  }
  c.beginPath(); c.arc(x,y,r*0.24,0,Math.PI*2); c.strokeStyle=GOLD; c.lineWidth=1.5; c.stroke();
  c.beginPath(); c.arc(x,y,r*0.10,0,Math.PI*2); c.fillStyle=GOLD; c.fill();
}
function spiral(c,x,y,rot,sc){

  c.restore();
}
function cornerOrn(c,x,y,sx,sy,sc){
  c.save(); c.translate(x,y); c.scale(sx*(sc||1),sy*(sc||1));

  c.strokeStyle=GOLD; c.lineWidth=3.2;
  c.beginPath(); c.moveTo(3,L); c.lineTo(3,3); c.lineTo(L,3); c.stroke();
  c.lineWidth=1.1;
  c.beginPath(); c.moveTo(16,L); c.lineTo(16,16); c.lineTo(L,16); c.stroke();
  for(k=0;k<6;k++){

    c.beginPath(); c.arc(9.5,t,2.1,0,Math.PI*2); c.fillStyle=GOLD; c.fill();
    c.beginPath(); c.arc(t,9.5,2.1,0,Math.PI*2); c.fill();

  c.font="600 25px "+CA; c.fillStyle=GOLD;

  c.beginPath(); c.arc(cx,cy,R,ang(d.h[0]),ang(d.h[1])); c.lineWidth=ring; c.strokeStyle=DAWN; c.stroke();
  c.beginPath(); c.arc(cx,cy,R,ang(d.h[1]),ang(d.h[4])); c.lineWidth=ring; c.strokeStyle=DAYC; c.stroke();
  c.beginPath(); c.arc(cx,cy,outR,0,Math.PI*2); c.strokeStyle="rgba(28,43,38,.14)"; c.lineWidth=2; c.stroke();
  c.beginPath(); c.arc(cx,cy,inR,0,Math.PI*2); c.stroke();
  for(i=0;i<48;i++){
    a=ang(i/2);
    var half=(i%2===1), major=(i%6===0), len=half?8:(major?20:13);
    c.beginPath();
    c.moveTo(cx+Math.cos(a)*(inR-2),cy+Math.sin(a)*(inR-2));
    c.lineTo(cx+Math.cos(a)*(inR-2-len),cy+Math.sin(a)*(inR-2-len));
    c.strokeStyle=major?"rgba(168,128,47,.72)":(half?"rgba(28,43,38,.13)":"rgba(28,43,38,.26)");
    c.lineWidth=major?3:(half?1.2:1.8); c.stroke();
  }
  c.textAlign="center"; c.textBaseline="middle";
  c.font="600 26px "+CA; c.fillStyle=MUT;
  for(i=0;i<8;i++){ var hh=i*3; a=ang(hh);
    c.fillText(String((hh%12)||12),cx+Math.cos(a)*(inR-42),cy+Math.sin(a)*(inR-42)); }
  c.textBaseline="alphabetic";

    c.beginPath(); c.moveTo(0,0); c.lineTo(-12,-22); c.lineTo(12,-22); c.closePath();
    c.fillStyle=ACC; c.globalAlpha=.9; c.fill(); c.globalAlpha=1; c.restore();
  }

  var items=[], hasV=d.verse.trim().length>0;
  if(hasV) items=items.concat([{t:d.verse,size:62,wt:"700 ",color:INK,after:14},

  if(d.hadith.trim()) items=items.concat([

             {t:d.href,size:hasV?27:30,fam:CA,color:ACC,lh:1.5,after:0}]);
  var RT=inR-52, span=2*(inR-104), sc=1, guard=0;
  var res=layoutMass(c,items,cy,RT,cy-200,sc);
  while(res.total>span&&sc>0.45&&guard++<60){ sc-=0.04; res=layoutMass(c,items,cy,RT,cy-200,sc); }
  res=layoutMass(c,items,cy,RT,cy-res.total/2,sc);
  res=layoutMass(c,items,cy,RT,cy-res.total/2,sc);
  c.textAlign="center";
  res.lines.forEach(function(l){
    c.font=(l.wt||"")+l.size+"px "+l.fam; c.fillStyle=l.color;
    c.fillText(l.t,cx,l.y+l.size*0.82);
  });

  for(i=0;i<6;i++) timeBadge(c,cx,cy,R,ang(d.h[i]),LAB[i],d.disp[i]);

  /* سطر التأمل تحت الدائرة، ثم الدعاء آخر شيء */
  if(d.refl.trim()){

  var ly=H-266;

  c.beginPath(); c.moveTo(180,ly); c.lineTo(W-180,ly); c.stroke(); c.globalAlpha=1;
  var e=ly+28;

  }

  if(!$("f_autosave").checked) return;
  var v=snapshot(), done=false;
  function ok(){ var el=$("saved"); el.textContent="تم الحفظ";
    setTimeout(function(){ if(el.textContent==="تم الحفظ") el.textContent=""; },1400); }
  try{ if(window.storage&&window.storage.set){ window.storage.set(KEY,v).then(ok)["catch"](function(){ if(fbSet(v)) ok(); }); done=true; } }catch(e){}
  if(!done&&fbSet(v)) ok();
}
function load(){
  return new Promise(function(res){
    function fin(r){ try{ res(r?JSON.parse(r):null); }catch(e){ res(null); } }
    try{
      if(window.storage&&window.storage.get){
        window.storage.get(KEY).then(function(r){ fin(r&&r.value?r.value:fbGet()); })["catch"](function(){ fin(fbGet()); });
        return;
      }
    }catch(e){}
    fin(fbGet());
  });
}
/* التصدير */
function stamp(){ var d=pickedDate(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function renderClean(){ EXPORTING=true; poster(ctx,state()); EXPORTING=false; }
$("btnShare").onclick=function(){
  renderClean();
  cv.toBlob(function(b){
    try{
      var f=[new File([b],"miqat-"+stamp()+".png",{type:"image/png"})];
      if(navigator.canShare&&navigator.canShare({files:f})){ navigator.share({files:f})["catch"](function(){}); render(); return; }
    }catch(e){}
    $("saved").textContent="المشاركة غير مدعومة هنا. استخدم التنزيل أو الضغط المطول على الصورة.";
    render();
  },"image/png");
};
$("btnReset").onclick=function(){
  $("f_city").selectedIndex=0; $("f_method").value=CITIES[0].m; $("f_asr").value="1";
  $("f_ihtiyat").value="1"; $("f_hijriAdj").value="0"; $("f_date").value=isoShift(1); $("f_palette").value="zaytoon";
  $("f_auto").checked=true; manualDate="";
  autoPick(); recalc(); render(); save();
};
/* بناء الحقول */
(function(){
  var box=$("timesBox"), i;
  for(i=0;i<6;i++){
    var cell=document.createElement("div");
    cell.innerHTML='<label for="h'+i+'">'+LAB[i]+'</label><div class="hm">'+
      '<input type="number" id="h'+i+'" min="1" max="12" inputmode="numeric"><span>:</span>'+
      '<input type="number" id="m'+i+'" min="0" max="59" inputmode="numeric"></div>';
    box.appendChild(cell);
  }
  CATEGORIES.forEach(function(c2){ var o=document.createElement("option"); o.textContent=c2; $("f_cat").appendChild(o); });
  CITIES.forEach(function(c2){ var o=document.createElement("option"); o.textContent=c2.n; $("f_city").appendChild(o); });
  Object.keys(METHODS).forEach(function(k){ var o=document.createElement("option"); o.value=k; o.textContent=METHODS[k].label; $("f_method").appendChild(o); });
})();
/* المستمعون */
$("f_cat").onchange=function(){ markManual(); applyPick(0); schedule(); };
$("f_vsel").onchange=function(){ markManual(); useVerse(); schedule(); };
$("f_hsel").onchange=function(){ markManual(); useHadith(); schedule(); };
$("f_dsel").onchange=function(){ markManual(); useDua(); schedule(); };
$("f_auto").onchange=function(){ if(this.checked){ manualDate=""; autoPick(); } schedule(); };
$("btnLock").onclick=function(){
  var locked=$("f_verse").hasAttribute("readonly");
  setLock(!locked);
  if(locked){ markManual(); $("f_verse").focus(); }
};
$("f_city").onchange=function(){ $("f_method").value=city().m; recalc(); schedule(); };
$("f_date").onchange=function(){ autoPick(); recalc(); paintSeg(); schedule(); };
Array.prototype.forEach.call($("dateSeg").querySelectorAll("button"),function(b){
  b.onclick=function(){
    $("f_date").value=isoShift(parseInt(b.getAttribute("data-v"),10));
    $("f_auto").checked=true; manualDate="";
    autoPick(); recalc(); paintSeg(); schedule();
  };
});
["f_method","f_asr","f_ihtiyat"].forEach(function(id){ $(id).onchange=function(){ recalc(); schedule(); }; });
var lastPack=-1;
$("btnShuffle").onclick=function(){
  var k=lastPack, n=0;
  while(k===lastPack&&n++<20) k=Math.floor(Math.random()*PACKS.length);
  lastPack=k;
  markManual();
  applyPack(PACKS[k]);
  schedule();
};
$("btnToday").onclick=function(){
  $("f_auto").checked=true; manualDate="";
  autoPick(); schedule();
};
$("f_hijriAdj").onchange=schedule;
$("f_show").onchange=schedule;
$("btnRecalc").onclick=function(){ recalc(); schedule(); };
["f_verse","f_vref","f_hadith","f_href","f_dua","f_refl"].forEach(function(id){
  $(id).addEventListener("input",markManual);
});
["f_verse","f_vref","f_hadith","f_href","f_dua","f_refl","f_sign",
 "h0","h1","h2","h3","h4","h5","m0","m1","m2","m3","m4","m5","f_palette"].forEach(function(id){
  $(id).addEventListener("input",schedule); $(id).addEventListener("change",schedule);
});
/* الإقلاع */
$("f_date").value=isoShift(1);
$("f_method").value=CITIES[0].m;
autoPick(); recalc();
load().then(function(s){
  if(s){
    if(typeof s.cityIdx==="number") $("f_city").selectedIndex=s.cityIdx;
    if(s.method) $("f_method").value=s.method;
    if(s.asr) $("f_asr").value=s.asr;
    if(s.ihtiyat) $("f_ihtiyat").value=s.ihtiyat;
    if(s.hijriAdj) $("f_hijriAdj").value=s.hijriAdj;
    if(s.show) $("f_show").value=s.show;
    if(s.palette&&PALETTES[s.palette]) $("f_palette").value=s.palette;
    if(s.sign!==undefined) $("f_sign").value=s.sign;
    $("f_auto").checked=s.auto!==false;
    manualDate=s.manualDate||"";
    if(!$("f_auto").checked&&manualDate===$("f_date").value){
      if(typeof s.cat==="number"){ $("f_cat").selectedIndex=s.cat; refreshLists(); }
      if(typeof s.vs==="number") $("f_vsel").selectedIndex=s.vs;
      if(typeof s.hs==="number") $("f_hsel").selectedIndex=s.hs;
      if(typeof s.ds==="number") $("f_dsel").selectedIndex=s.ds;
      if(s.verse) $("f_verse").value=s.verse;
      if(s.vref) $("f_vref").value=s.vref;
      if(s.hadith!==undefined) $("f_hadith").value=s.hadith;
      if(s.href!==undefined) $("f_href").value=s.href;
      if(s.dua!==undefined) $("f_dua").value=s.dua;
      if(s.refl!==undefined) $("f_refl").value=s.refl;
    } else { autoPick(); }
    recalc();
  }
  paintSeg();
  var go=function(){ render(); };
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(go); setTimeout(go,1700); } else go();
});

}catch(e){ fail(e); }
})();
</script>

if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
